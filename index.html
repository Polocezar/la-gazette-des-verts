<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Gazette des Verts</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 900px) {
      .container { grid-template-columns: 1fr 1fr; }
      .full-width { grid-column: span 2; }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    h1, h2 { margin-top: 0; color: var(--accent-green); }
    .header { text-align: center; padding: 10px 0; }

    .select-group { display: flex; gap: 10px; margin-bottom: 20px; }

    select, input, button {
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
    }

    select { flex: 1; }
    button { background-color: var(--accent-green); color: #000; font-weight: bold; cursor: pointer; border: none; }
    .btn-danger { background-color: #ef4444; color: #fff; }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .team-name { flex: 1; font-size: 0.95rem; }
    .team-home { text-align: right; }
    .team-away { text-align: left; }

    .score-inputs { display: flex; align-items: center; gap: 8px; margin: 0 15px; }
    .score-input { width: 45px; text-align: center; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; text-align: center; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-muted); }
    .col-club { text-align: left; }
    .highlight-asse { background-color: rgba(16, 185, 129, 0.15); font-weight: bold; }

    .news-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
    }
    .news-title { color: var(--text-main); text-decoration: none; }
    .news-source { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="header">
    <h1>LA GAZETTE DES VERTS</h1>
    <p style="color: var(--text-muted);">Suivi de la saison</p>
  </div>

  <div class="container">

    <div class="card full-width">
      <h2>Dernières Actualités ASSE</h2>
      <div id="news-container">Chargement...</div>
    </div>

    <div class="card">
      <h2 id="form-title">Saisie des Matchs</h2>
      <div class="select-group">
        <select id="select-mois" onchange="filterJourneesByMonth()"></select>
        <select id="select-journee" onchange="changeJournee()"></select>
      </div>
      <div id="match-list-container"></div>
      <button onclick="saveCurrentJourneeScores()" style="width: 100%; margin-top: 15px;">Enregistrer la journée</button>
    </div>

    <div class="card">
      <h2>Meilleurs Buteurs</h2>
      <table>
        <thead>
          <tr><th>#</th><th class="col-club">Joueur</th><th>Club</th><th style="text-align: right;">Buts</th></tr>
        </thead>
        <tbody id="top-scorers-body"></tbody>
      </table>
      <button onclick="addManualScorer()" style="margin-top: 15px; width: 100%;">+ Ajouter un buteur</button>
    </div>

    <div class="card full-width">
      <h2>Classement Général Ligue 2</h2>
      <table>
        <thead>
          <tr>
            <th class="col-club">Club</th><th>MJ</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>DB</th><th>PTS</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
      <div style="margin-top: 20px; text-align: center;">
        <button class="btn-danger" onclick="resetSeasonData()">🗑️ RÉINITIALISER LE CHAMPIONNAT</button>
      </div>
    </div>

  </div>

  <script>
    const moisSaison = [
      { id: "08", name: "Août", journees: [1, 2, 3, 4] },
      { id: "09", name: "Septembre", journees: [5, 6, 7] },
      { id: "10", name: "Octobre", journees: [8, 9, 10, 11] }
    ];

    const clubs = [
      "AS Saint-Étienne", "FC Sochaux-Montbéliard", "Clermont Foot 63", "Stade de Reims",
      "Dijon FCO", "Montpellier HSC", "USL Dunkerque", "Grenoble Foot 38",
      "Rodez AF", "Stade Lavallois", "FC Nantes", "Red Star FC",
      "FC Metz", "EA Guingamp", "AS Nancy-Lorraine", "US Boulogne",
      "Pau FC", "FC Annecy"
    ];

    let currentJournee = 2;
    let seasonMatches = {};
    let topScorers = [
      { name: "Irvin Cardona", club: "ASSE", goals: 2 },
      { name: "Egor Prutsev", club: "Dunkerque", goals: 2 },
      { name: "Yadaly Diaby", club: "Grenoble", goals: 2 },
      { name: "Jakob Breum", club: "ASSE", goals: 1 },
      { name: "Thierno Ballo", club: "ASSE", goals: 1 }
    ];

    function createDefaultSeasonMatches() {
      let matches = {};
      for (let j = 1; j <= 34; j++) {
        matches[j] = [];
        for (let i = 0; i < clubs.length / 2; i++) {
          matches[j].push({ home: clubs[i], homeScore: "", awayScore: "", away: clubs[clubs.length - 1 - i] });
        }
      }
      matches[1][0] = { home: "FC Sochaux-Montbéliard", homeScore: 0, awayScore: 3, away: "AS Saint-Étienne" };
      matches[2][0] = { home: "AS Saint-Étienne", homeScore: 3, awayScore: 1, away: "Clermont Foot 63" };
      return matches;
    }

    function initSeason() {
      const savedMatches = localStorage.getItem("gazette_season_matches");
      seasonMatches = savedMatches ? JSON.parse(savedMatches) : createDefaultSeasonMatches();
      
      const savedScorers = localStorage.getItem("gazette_top_scorers");
      if (savedScorers) topScorers = JSON.parse(savedScorers);
    }

    function setupSelects() {
      const mSel = document.getElementById("select-mois");
      mSel.innerHTML = moisSaison.map(m => `<option value="${m.id}">${m.name}</option>`).join("");
      
      const jSel = document.getElementById("select-journee");
      jSel.innerHTML = moisSaison[0].journees.map(j => `<option value="${j}">Journée ${j}</option>`).join("");
    }

    function filterJourneesByMonth() {
      const mId = document.getElementById("select-mois").value;
      const mObj = moisSaison.find(m => m.id === mId) || moisSaison[0];
      const jSel = document.getElementById("select-journee");
      jSel.innerHTML = mObj.journees.map(j => `<option value="${j}">Journée ${j}</option>`).join("");
      currentJournee = mObj.journees[0];
      renderMatches();
    }

    function changeJournee() {
      currentJournee = parseInt(document.getElementById("select-journee").value);
      renderMatches();
    }

    function renderMatches() {
      document.getElementById("form-title").textContent = `JOURNÉE ${currentJournee}`;
      const container = document.getElementById("match-list-container");
      const list = seasonMatches[currentJournee] || [];

      container.innerHTML = list.map((m, idx) => `
        <div class="match-row">
          <span class="team-name team-home">${m.home}</span>
          <div class="score-inputs">
            <input type="number" class="score-input" id="home-${idx}" value="${m.homeScore !== undefined ? m.homeScore : ''}">
            <span>-</span>
            <input type="number" class="score-input" id="away-${idx}" value="${m.awayScore !== undefined ? m.awayScore : ''}">
          </div>
          <span class="team-name team-away">${m.away}</span>
        </div>
      `).join("");
    }

    function saveCurrentJourneeScores() {
      const list = seasonMatches[currentJournee] || [];
      list.forEach((m, idx) => {
        const h = document.getElementById(`home-${idx}`).value;
        const a = document.getElementById(`away-${idx}`).value;
        m.homeScore = h !== "" ? parseInt(h) : "";
        m.awayScore = a !== "" ? parseInt(a) : "";
      });
      localStorage.setItem("gazette_season_matches", JSON.stringify(seasonMatches));
      renderStandingsAndStats();
      alert("Enregistré !");
    }

    function renderStandingsAndStats() {
      let teams = {};
      clubs.forEach(c => teams[c] = { name: c, mj: 0, g: 0, n: 0, p: 0, bp: 0, bc: 0, db: 0, pts: 0 });

      Object.keys(seasonMatches).forEach(j => {
        (seasonMatches[j] || []).forEach(m => {
          if (m.homeScore !== "" && m.awayScore !== "" && !isNaN(m.homeScore)) {
            let h = teams[m.home], a = teams[m.away];
            if (h && a) {
              h.mj++; a.mj++;
              h.bp += m.homeScore; h.bc += m.awayScore;
              a.bp += m.awayScore; a.bc += m.homeScore;
              if (m.homeScore > m.awayScore) { h.g++; h.pts += 3; a.p++; }
              else if (m.homeScore < m.awayScore) { a.g++; a.pts += 3; h.p++; }
              else { h.n++; h.pts++; a.n++; a.pts++; }
              h.db = h.bp - h.bc; a.db = a.bp - a.bc;
            }
          }
        });
      });

      const sorted = Object.values(teams).sort((a,b) => b.pts - a.pts || b.db - a.db);
      document.getElementById("standings-body").innerHTML = sorted.map((t, i) => `
        <tr class="${t.name.includes("Saint-Étienne") ? 'highlight-asse' : ''}">
          <td class="col-club">${i+1}. ${t.name}</td>
          <td>${t.mj}</td><td>${t.g}</td><td>${t.n}</td><td>${t.p}</td>
          <td>${t.bp}</td><td>${t.bc}</td><td>${t.db}</td><td><strong>${t.pts}</strong></td>
        </tr>
      `).join("");

      topScorers.sort((a,b) => b.goals - a.goals);
      document.getElementById("top-scorers-body").innerHTML = topScorers.slice(0,5).map((s, i) => `
        <tr class="${s.club === 'ASSE' ? 'highlight-asse' : ''}">
          <td><strong>${i+1}</strong></td>
          <td>${s.name}</td>
          <td style="color: var(--text-muted);">${s.club}</td>
          <td style="text-align: right; font-weight: bold;">${s.goals}</td>
        </tr>
      `).join("");
    }

    function addManualScorer() {
      const name = prompt("Nom :");
      const club = prompt("Club :");
      const goals = parseInt(prompt("Buts :") || "0");
      if (name && club) {
        topScorers.push({ name, club, goals });
        localStorage.setItem("gazette_top_scorers", JSON.stringify(topScorers));
        renderStandingsAndStats();
      }
    }

    function resetSeasonData() {
      if (confirm("Réinitialiser ?")) {
        localStorage.clear();
        initSeason();
        setupSelects();
        renderMatches();
        renderStandingsAndStats();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initSeason();
      setupSelects();
      renderMatches();
      renderStandingsAndStats();
    });
  </script>
</body>
</html>
